<style>
body {
  margin: 0;
  height: 100vh;
  background: url("1000922353.jpg") no-repeat center center fixed;
  background-size: cover;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

/* Blinking stars */
.stars {
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(white 1px, transparent 1px);
  background-size: 70px 70px, 130px 130px;
  background-position: 0 0, 40px 60px;
  animation: blink 3s infinite alternate;
  pointer-events: none;
  z-index: 1;
}

@keyframes blink {
  from { opacity: 0.3; }
  to   { opacity: 0.8; }
}

/* Shooting star */
.shooting-star {
  position: fixed;
  top: 20%;
  left: 100%;
  width: 160px;
  height: 2px;
  background: linear-gradient(90deg, white, transparent);
  animation: shoot 8s linear infinite;
  opacity: 0.7;
  z-index: 2;
}

@keyframes shoot {
  0%   { transform: translateX(0) translateY(0); opacity: 1; }
  100% { transform: translateX(-130vw) translateY(70vh); opacity: 0; }
}

/* Popup */
.popup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 182, 193, 0.18);
  border: 2px solid pink;
  border-radius: 20px;
  padding: 25px;
  width: 320px;
  text-align: center;
  z-index: 10;
}

/* Buttons */
button {
  margin: 8px;
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

.yes {
  background: #ff69b4;
  color: white;
}

.bigyes {
  background: #ff1493;
  color: white;
}

.no {
  background: transparent;
  color: white;
  border: 1px solid white;
}

/* Floating hearts */
.heart {
  position: absolute;
  animation-name: float;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
  z-index: 5;
}

@keyframes float {
  from { transform: translateY(0) scale(1); opacity: 1; }
  to   { transform: translateY(-300px) scale(1.3); opacity: 0; }
}
</style>
</head>

/* ▶️ PLAY MUSIC SAFELY */

/* Hearts */

    const duration = Math.random() * 2 + 2.5;
    h.style.animationDuration = duration + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), duration * 1000);
  }
}

/* Combined click handler */

  playMusic();
